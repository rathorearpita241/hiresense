[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiresense-ml"
version = "0.1.0"
description = "HireSense ML service and shared data-science core"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*", "hiresense_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
